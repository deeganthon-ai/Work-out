workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    environment:
      vars:
        EXPO_NO_TELEMETRY: "1"
      node: 20
    scripts:
      - npm install
      - npx expo prebuild --platform android --clean
      - cd android && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
